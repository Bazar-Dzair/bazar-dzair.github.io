<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#061e3d">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
<title>Bazar Dzair — لا يوجد اتصال</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:#061e3d;color:#fff;font-family:Tahoma,Arial,sans-serif;text-align:center}
.box{max-width:380px;width:100%}
img{width:96px;height:96px;border-radius:22px;background:#fff;margin-bottom:20px}
h1{font-size:22px;margin:0 0 10px}
p{margin:0 0 22px;line-height:1.8;color:#cfd8e6;font-size:15px}
button{width:100%;border:0;border-radius:12px;padding:14px;font-size:16px;font-weight:800;background:#ff6a00;color:#fff;cursor:pointer;font-family:inherit}
button:active{opacity:.85}
.note{margin-top:16px;font-size:13px;color:#9fb0c8}
</style>
</head>
<body>
<div class="box">
  <img src="/icons/icon-192.png" alt="Bazar Dzair" width="96" height="96">
  <h1 id="t">لا يوجد اتصال بالإنترنت</h1>
  <p id="p">تعذّر تحميل هذه الصفحة. تأكد من اتصالك ثم أعد المحاولة. لا يتم تسجيل أي طلب إلا عند وجود اتصال.</p>
  <button id="r" type="button">إعادة المحاولة</button>
  <div class="note" id="n">سنعيد التحميل تلقائيًا عند عودة الاتصال</div>
</div>
<script>
(function(){
  try{
    if(localStorage.getItem("bazarLang")==="fr"){
      document.documentElement.lang="fr";document.documentElement.dir="ltr";
      document.getElementById("t").textContent="Pas de connexion Internet";
      document.getElementById("p").textContent="Impossible de charger cette page. Vérifiez votre connexion puis réessayez. Aucune commande n'est enregistrée sans connexion.";
      document.getElementById("r").textContent="Réessayer";
      document.getElementById("n").textContent="Rechargement automatique au retour de la connexion";
      document.title="Bazar Dzair — Hors ligne";
    }
  }catch(e){}
  document.getElementById("r").addEventListener("click",function(){location.reload()});
  window.addEventListener("online",function(){location.reload()});
})();
</script>
</body>
</html>
