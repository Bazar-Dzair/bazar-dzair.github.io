<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#061e3d;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0b2c56;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="100" cy="100" r="100" fill="url(#grad1)"/>
  
  <!-- Shopping bag icon -->
  <g transform="translate(100, 100)">
    <!-- Bag body -->
    <rect x="-35" y="-20" width="70" height="60" rx="8" fill="none" stroke="#ff6a00" stroke-width="3"/>
    
    <!-- Bag handles -->
    <path d="M -20,-20 Q -20,-40 0,-45 Q 20,-40 20,-20" fill="none" stroke="#ff6a00" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Price tag inside -->
    <circle cx="0" cy="15" r="12" fill="#ff6a00"/>
    <text x="0" y="22" font-size="14" font-weight="bold" text-anchor="middle" fill="#061e3d">د</text>
  </g>
  
  <!-- Text label -->
  <text x="100" y="170" font-size="16" font-weight="bold" text-anchor="middle" fill="#ff6a00" font-family="Arial, sans-serif">
    BAZAR DZAIR
  </text>
</svg>
