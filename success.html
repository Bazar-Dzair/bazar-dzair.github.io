<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="logo.svg" type="image/svg+xml">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>تم تأكيد الطلب | Bazar Dzair</title>
<meta name="theme-color" content="#071b33">
<style>
:root{--navy:#071b33;--orange:#ff6a00;--green:#16a34a;--bg:#f5f7fa;--text:#172033;--muted:#667085;--border:#e4e7ec}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Tahoma,sans-serif;line-height:1.7}
main{max-width:640px;width:92%;margin:9vh auto;background:#fff;border:1px solid var(--border);border-radius:26px;box-shadow:0 12px 40px #0000000f;padding:44px 30px;text-align:center}
.icon{width:96px;height:96px;border-radius:50%;background:#eafbea;color:var(--green);display:grid;place-items:center;font-size:52px;margin:0 auto}
h1{color:var(--navy);margin:18px 0 6px;font-size:26px}
p{color:var(--muted);margin:0 0 4px;line-height:1.9}
.note{background:#f8fafc;border:1px solid var(--border);border-radius:14px;padding:18px;margin:18px 0;color:var(--text);font-size:15px;text-align:right}
.note b{color:var(--orange)}
.btns{display:flex;flex-direction:column;gap:12px;margin-top:8px}
.back,.back2{display:block;text-align:center;background:var(--navy);color:#fff;padding:15px;border-radius:12px;font-weight:800;text-decoration:none}
.what{display:block;text-align:center;background:var(--green);color:#fff;padding:15px;border-radius:12px;font-weight:800;text-decoration:none;margin-bottom:6px}
</style>
</head>
<body>
<main>
  <div class="icon">✅</div>
  <h1>تم تسجيل طلبك بنجاح</h1>
  <p>شكرًا لثقتك في متجر Bazar Dzair 🛍️</p>
  <div class="note">
    سنتصل بك قريبًا على رقم هاتفك لتأكيد الطلب وتحديد موعد التوصيل.<br>
    <b>الدفع عند الاستلام</b> — لا تدفع أي مبلغ الآن.
  </div>
  <div class="btns">
    <a class="what" href="https://wa.me/213500000000" target="_blank" rel="noopener">💬 أرسل تأكيدًا عبر واتساب</a>
    <a class="back2" href="./">← العودة إلى المتجر</a>
  </div>
</main>
</body>
</html>
