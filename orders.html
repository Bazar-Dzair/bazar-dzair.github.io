<title>الطلبات</title>

<style>
body{
    margin:0;
    background:#f5f5f5;
    font-family:Arial,sans-serif;
}
header{
    background:#111827;
    color:#fff;

}

    padding:20px;
}
.card{
    background:#fff;
    border-radius:12px;
    padding:15px;
    margin-bottom:15px;
    box-shadow:0 2px 8px rgba(0,0,0,.1);
}
.card h3{
    margin:0 0 10px;
}
button{
    border:none;
    padding:10px 15px;
    border-radius:8px;
    cursor:pointer;
    margin:5px;
}

    background:#16a34a;
    color:white;
}

    background:#dc2626;

}
</style>
</head>

<body>

<a class="lang-switch" href="/fr/orders.html" title="Français">FR</a>
<header>📦 الطلبات</header>

<div id="orders"></div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
getFirestore,
collection,
query,
orderBy,
onSnapshot,
doc,
updateDoc,
deleteDoc
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

import {
getAuth,
onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyBWdA_QIy_2gOBl-bP1S1tLaGIqaZjpar8",
  authDomain: "bazar-dzair-33816.firebaseapp.com",
  projectId: "bazar-dzair-33816",
  storageBucket: "bazar-dzair-33816.firebasestorage.app",
  messagingSenderId: "51073161969",
  appId: "1:51073161969:web:cb75a3224bdca11ea8e750"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

const ordersDiv = document.getElementById("orders");

// ✅ بوابة تسجيل دخول من جهة الواجهة (طبقة حماية إضافية فوق Firestore Rules).
// هذه الصفحة كانت تعتمد على القواعد فقط بدون أي تحقق هنا؛ الآن تُحوَّل لصفحة
// تسجيل الدخول مباشرة إذا لم يكن هناك مستخدم مسجّل — بدل عرض شاشة "تعذر تحميل
// الطلبات" التي تكشف مسار /orders.html كصفحة إدارية بدون توجيه واضح.
ordersDiv.innerHTML = "<h2 style='text-align:center'>⏳ التحقق من تسجيل الدخول...</h2>";
onAuthStateChanged(auth, (u) => {
  if (!u) {
    location.href = "/admin.html";
    return;
  }
  startOrdersListener();
});

// ⚠️ إصلاح أمني حرج (Stored XSS): بيانات الطلب (product, customerName, customerPhone,
// wilaya, address, status) هي مدخلات يتحكم بها الزبون (أو أي شخص يرسل طلبًا مباشرة إلى
// Firestore). كانت تُدرج سابقًا داخل innerHTML بدون أي تهريب (escaping)، مما يسمح لأي شخص
// بإنشاء طلب باسم يحتوي كود HTML/JS ضار (مثل <img onerror=...>) يُنفَّذ في متصفح الأدمن
// بمجرد فتح هذه الصفحة — وهذا قد يُستخدم لسرقة جلسة تسجيل دخول الأدمن بالكامل.
// الحل: تهريب كل قيمة نصية قبل إدراجها في HTML.
function esc(v){return String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");}

function startOrdersListener(){
const q = query(
    collection(db,"orders")
);

onSnapshot(q,(snapshot)=>{

    ordersDiv.innerHTML="";

    if(snapshot.empty){
        ordersDiv.innerHTML="<h2 style='text-align:center'>لا توجد طلبات</h2>";
        return;
    }

    snapshot.forEach((docSnap)=>{

        const order=docSnap.data();

        ordersDiv.innerHTML += `
        <div class="card">

        <h3>${esc(order.product)}</h3>

        <p>👤 ${esc(order.customerName)}</p>

        <p>📞 ${esc(order.customerPhone)}</p>

        <p>📍 ${esc(order.wilaya)}</p>

        <p>🏠 ${esc(order.address)}</p>

        <p>💰 ${esc(order.total)} دج</p>

        <p>📦 الحالة :
        <b>${esc(order.status)}</b>
        </p>

        <button class="accept"
        onclick="acceptOrder('${docSnap.id}')">
        قبول
        </button>

        <button class="reject"
        onclick="rejectOrder('${docSnap.id}')">
        رفض
        </button>

        <button class="delete"
        onclick="deleteOrder('${docSnap.id}')">
        حذف
        </button>

        </div>
        `;

    });

},(err)=>{
  console.error("تعذر قراءة الطلبات",err);
  ordersDiv.innerHTML="<h2 style='text-align:center'>تعذر تحميل الطلبات</h2><p style='text-align:center'>تحقق من Firestore Rules ثم حدّث الصفحة.</p>";
});
} // نهاية startOrdersListener()

window.acceptOrder = async(id)=>{
try{
await updateDoc(doc(db,"orders",id),{
status:"مقبول"
});
}catch(e){console.error(e);alert("تعذر قبول الطلب: "+e.message)}
}

window.rejectOrder = async(id)=>{
try{
await updateDoc(doc(db,"orders",id),{
status:"مرفوض"
});
}catch(e){console.error(e);alert("تعذر رفض الطلب: "+e.message)}
}

window.deleteOrder = async(id)=>{
if(confirm("حذف الطلب؟")){
try{
await deleteDoc(doc(db,"orders",id));
}catch(e){console.error(e);alert("تعذر حذف الطلب: "+e.message)}
}
}

</script>

</body>
</html>
