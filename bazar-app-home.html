<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#9b1560">
<title>Bazar Dzair – Tous les produits</title>
<style>
:root{
  --plum:#9b1560; --plum-d:#7d0f4c; --bg:#dfe6ef; --card:#fff; --text:#16161d;
  --price:#e8590c; --ok-bg:#dff5ea; --ok-bd:#a7e3c4; --ok:#1f9d63; --muted:#8a8fa3;
  --shadow:0 2px 10px rgba(30,40,80,.10); color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#14161d;--card:#1f222c;--text:#f2f3f7;--ok-bg:#12372a;--ok-bd:#1d6a4a;--ok:#5fd6a0;--muted:#9aa0b4;--shadow:0 2px 10px rgba(0,0,0,.4);color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#14161d;--card:#1f222c;--text:#f2f3f7;--ok-bg:#12372a;--ok-bd:#1d6a4a;--ok:#5fd6a0;--muted:#9aa0b4;--shadow:0 2px 10px rgba(0,0,0,.4);color-scheme:dark}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--text);font-family:Roboto,"Segoe UI",system-ui,sans-serif}
:root{padding-top:env(safe-area-inset-top,0px)}
html{scroll-padding-top:70px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--plum);z-index:30}
button{font:inherit;border:0;cursor:pointer;color:inherit;background:none}
svg{display:block}
:focus-visible{outline:3px solid #ffb703;outline-offset:2px}

/* top bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--card);box-shadow:var(--shadow)}
.topbar-in{max-width:1200px;margin:auto;display:flex;align-items:center;justify-content:space-between;padding:10px 16px;gap:8px}
.ibtn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--plum);position:relative;transition:background .15s}
.ibtn:hover{background:rgba(155,21,96,.1)}
.ibtn svg{width:26px;height:26px;fill:currentColor}
.dot{position:absolute;top:6px;inset-inline-end:6px;min-width:16px;height:16px;border-radius:8px;background:var(--price);color:#fff;font-size:10px;font-weight:700;display:none;place-items:center;padding:0 4px}
.dot.on{display:grid}
.searchrow{max-width:1200px;margin:auto;padding:0 16px;display:none}
.searchrow.open{display:block;padding-bottom:10px}
.searchrow input{width:100%;height:44px;border-radius:22px;border:2px solid var(--plum);padding:0 18px;font-size:16px;background:var(--card);color:var(--text)}

/* main */
main{max-width:1200px;margin:auto;padding:14px 14px 110px}
.allbtn{width:100%;height:54px;border-radius:18px;background:var(--plum);color:#fff;display:flex;align-items:center;gap:14px;padding:0 20px;font-size:20px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;margin-bottom:16px;box-shadow:var(--shadow)}
.allbtn svg{width:24px;height:24px;fill:#fff}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
@media(min-width:640px){.grid{grid-template-columns:repeat(3,1fr);gap:18px}}
@media(min-width:960px){.grid{grid-template-columns:repeat(4,1fr)}}

.card{background:var(--card);border-radius:22px;overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column}
.media{position:relative;aspect-ratio:1/.98;display:grid;place-items:center;font-size:64px;overflow:hidden}
.media img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.fav{position:absolute;top:10px;inset-inline-end:10px;width:44px;height:44px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 1px 6px rgba(0,0,0,.2);transition:transform .15s}
.fav:active{transform:scale(.88)}
.fav svg{width:26px;height:26px;fill:none;stroke:var(--plum);stroke-width:2.2;stroke-linejoin:round}
.fav.on svg{fill:var(--plum)}
.fav.on{animation:pop .25s}
@keyframes pop{50%{transform:scale(1.2)}}
.info{padding:12px 12px 14px;display:flex;flex-direction:column;gap:8px;flex:1}
.name{font-size:17px;font-weight:700;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row{display:flex;align-items:center;justify-content:space-between;gap:6px;flex-wrap:wrap}
.price{color:var(--price);font-size:20px;font-weight:800}
.badge{font-size:12.5px;font-weight:700;border-radius:999px;padding:4px 10px;background:var(--ok-bg);color:var(--ok);border:1px solid var(--ok-bd)}
.badge.out{background:#fde7e7;color:#c62828;border-color:#f4b4b4}
.buy{margin-top:auto;height:48px;border-radius:24px;background:var(--plum);color:#fff;display:flex;align-items:center;justify-content:center;gap:10px;font-size:18px;font-weight:700;transition:background .15s,transform .1s}
.buy:hover{background:var(--plum-d)}
.buy:active{transform:scale(.97)}
.buy:disabled{background:var(--muted);cursor:not-allowed}
.buy svg{width:22px;height:22px;fill:none;stroke:#fff;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.empty{grid-column:1/-1;text-align:center;padding:40px 10px;color:var(--muted);font-size:17px}

/* bottom nav */
nav{position:fixed;inset:auto 0 0;z-index:20;background:var(--card);box-shadow:0 -2px 12px rgba(0,0,0,.12);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-in{max-width:680px;margin:auto;display:grid;grid-template-columns:repeat(6,1fr)}
.nav-in button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px 9px;font-size:12px;color:var(--muted);position:relative;min-width:0}
.nav-in button span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav-in svg{width:30px;height:30px}
.nav-in .on{color:var(--plum);font-weight:700}
.nav-in .on svg{filter:none}
.nav-in .cnt{position:absolute;top:4px;inset-inline-start:calc(50% + 6px);min-width:18px;height:18px;border-radius:9px;background:var(--price);color:#fff;font-size:11px;font-weight:700;display:none;place-items:center;padding:0 4px}
.nav-in .cnt.on{display:grid}
.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:#222;color:#fff;padding:10px 18px;border-radius:22px;font-size:15px;opacity:0;pointer-events:none;transition:.25s;z-index:40;max-width:90vw}
.toast.show{opacity:1;transform:translate(-50%,0)}
[hidden]{display:none!important}
.vlink{color:var(--plum);font-weight:700;display:inline-block;padding:6px 0}
.cart-title{font-size:22px;font-weight:800;margin:4px 4px 14px}
.crow{background:var(--card);border-radius:20px;box-shadow:var(--shadow);display:flex;align-items:center;gap:12px;padding:10px;margin-bottom:12px}
.cthumb{width:84px;height:84px;border-radius:16px;display:grid;place-items:center;font-size:38px;flex:none;position:relative;overflow:hidden}
.cthumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cmid{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.cname{font-size:16px;font-weight:700;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cprice{color:var(--price);font-weight:800;font-size:17px}
.qty{display:inline-flex;align-items:center;gap:4px;background:var(--bg);border-radius:20px;padding:2px;align-self:flex-start}
.qty button{width:36px;height:36px;border-radius:50%;background:var(--card);color:var(--plum);font-size:22px;font-weight:700;line-height:1}
.qty button:disabled{opacity:.35}
.qty b{min-width:28px;text-align:center;font-size:16px}
.cdel{width:44px;height:44px;border-radius:50%;color:#c62828;display:grid;place-items:center;flex:none}
.cdel svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.cart-sum{display:flex;justify-content:space-between;align-items:center;background:var(--card);border-radius:20px;box-shadow:var(--shadow);padding:16px 18px;margin:16px 0 14px;font-size:18px}
.cart-sum strong{color:var(--price);font-size:24px}
#cartView,#orderView{max-width:640px;margin:auto}
.fld{margin-bottom:14px}
.fld label{display:block;font-weight:700;font-size:15px;margin:0 4px 6px}
.fld input,.fld select{width:100%;height:50px;border-radius:16px;border:2px solid transparent;background:var(--card);color:var(--text);padding:0 16px;font-size:16px;box-shadow:var(--shadow)}
.fld input:focus,.fld select:focus{border-color:var(--plum);outline:0}
.fld.bad input,.fld.bad select{border-color:#c62828}
.err{display:none;color:#c62828;font-size:13.5px;margin:5px 6px 0}
.fld.bad .err{display:block}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.opt{position:relative;background:var(--card);border:2px solid transparent;border-radius:16px;padding:12px;box-shadow:var(--shadow);cursor:pointer;display:flex;flex-direction:column;gap:3px}
.opt input{position:absolute;opacity:0;inset:0;cursor:pointer}
.opt:has(input:checked){border-color:var(--plum);background:rgba(155,21,96,.07)}
.opt:has(input:focus-visible){outline:3px solid #ffb703}
.opt:has(input:disabled){opacity:.45;cursor:not-allowed}
.opt b{font-size:15px}.opt span{color:var(--price);font-weight:800}
.sumbox{background:var(--card);border-radius:20px;box-shadow:var(--shadow);padding:14px 18px;margin:6px 0 14px;display:grid;gap:8px}
.sumbox div{display:flex;justify-content:space-between}
.sumbox .tot{border-top:1px solid var(--bg);padding-top:10px;font-size:18px;font-weight:800}
.sumbox .tot strong{color:var(--price);font-size:22px}
.cod{font-size:14px;color:var(--muted);text-align:center;margin-bottom:12px}
.back{margin:0 4px 12px;color:var(--plum);font-weight:700;font-size:16px;padding:8px 4px}
.done{text-align:center;padding:30px 10px;display:grid;gap:12px;justify-items:center}
.done .ok{width:84px;height:84px;border-radius:50%;background:var(--ok-bg);display:grid;place-items:center}
.done svg{width:46px;height:46px;fill:none;stroke:var(--ok);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.done h2{font-size:23px}.done p{color:var(--muted);line-height:1.5}
#ordersView{max-width:640px;margin:auto}
.media[data-open],.name[data-open]{cursor:pointer}
#detailView{max-width:960px;margin:auto}
#accountView{max-width:640px;margin:auto}
.guestbox{background:var(--card);border:2px dashed var(--plum);border-radius:20px;padding:14px 16px;margin-bottom:16px;display:grid;gap:4px}
.guestbox b{color:var(--plum);font-size:16px}
.guestbox p{color:var(--muted);font-size:14.5px;line-height:1.5}
.optin{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:12px 14px;margin-bottom:12px;font-size:15px;cursor:pointer}
.optin input{width:22px;height:22px;accent-color:var(--plum);flex:none}
.acc-head{display:flex;align-items:center;gap:14px;background:var(--plum);color:#fff;border-radius:22px;padding:18px;margin-bottom:14px;box-shadow:var(--shadow)}
.avatar{width:62px;height:62px;border-radius:50%;background:#fff;color:var(--plum);display:grid;place-items:center;font-size:28px;font-weight:800;flex:none}
.acc-head b{font-size:20px;display:block}
.acc-head small{opacity:.85;font-size:14px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px}
.stat{background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:12px 6px;text-align:center}
.stat strong{display:block;font-size:24px;color:var(--plum)}
.stat span{font-size:13px;color:var(--muted)}
.sec-t{font-size:17px;font-weight:800;margin:6px 4px 10px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--card);border-radius:18px;padding:5px;box-shadow:var(--shadow);margin-bottom:18px}
.seg button{height:42px;border-radius:14px;font-weight:700;color:var(--muted)}
.seg button.on{background:var(--plum);color:#fff}
.wipe{width:100%;margin-top:14px;height:48px;border-radius:24px;border:2px solid #c62828;color:#c62828;font-weight:700}
.dwrap{display:grid;gap:16px}
@media(min-width:900px){.dwrap{grid-template-columns:1fr 1fr;gap:28px;align-items:start}}
.dmedia{position:relative;aspect-ratio:1/.85;border-radius:24px;display:grid;place-items:center;font-size:110px;overflow:hidden;box-shadow:var(--shadow)}
.dmedia img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.dinfo{display:grid;gap:14px;align-content:start}
.dname{font-size:24px;font-weight:800;line-height:1.25}
.dprice{color:var(--price);font-size:30px;font-weight:800}
.dline{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.low{color:#b45309;font-size:14px;font-weight:700}
.ddesc{line-height:1.6;color:var(--muted);font-size:16px}
.dqty{display:flex;align-items:center;gap:12px;font-weight:700}
.dact{display:grid;gap:10px}
.buy.alt{background:var(--card);color:var(--plum);border:2px solid var(--plum)}
.buy.alt:hover{background:rgba(155,21,96,.08)}
.buy.alt svg{stroke:var(--plum)}
.ocard{background:var(--card);border-radius:20px;box-shadow:var(--shadow);padding:14px 16px;margin-bottom:12px;display:grid;gap:10px}
.otop{display:flex;justify-content:space-between;align-items:center;gap:8px}
.otop b{font-size:17px}
.odate{color:var(--muted);font-size:13.5px}
.st{font-size:12.5px;font-weight:700;border-radius:999px;padding:4px 10px;background:#fff1e0;color:#b45309}
.st.c{background:#fde7e7;color:#c62828}
.oitems{display:grid;gap:4px;font-size:15px}
.oitems div{display:flex;justify-content:space-between;gap:10px}
.oitems span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.oloc{color:var(--muted);font-size:14px}
.obot{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--bg);padding-top:10px}
.obot strong{color:var(--price);font-size:19px}
.ocancel{color:#c62828;font-weight:700;padding:8px 12px;border-radius:18px;border:1.5px solid #c62828}
#cartView .buy{width:100%}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-in">
    <button class="ibtn" aria-label="Menu" data-toast="Menu"><svg viewBox="0 0 24 24"><circle cx="12" cy="4" r="2.4"/><circle cx="12" cy="12" r="2.4"/><circle cx="12" cy="20" r="2.4"/></svg></button>
    <button class="ibtn" aria-label="Messages" data-toast="Messages"><svg viewBox="0 0 24 24"><path d="M3 4h11a2 2 0 0 1 2 2v6a2 2 0 0 1-2 2H8l-4 3v-3H3a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1zm13 4h4a2 2 0 0 1 2 2v7a1 1 0 0 1-1 1h-1v3l-3-3h-5a2 2 0 0 1-2-2v-1h5a2 2 0 0 0 2-2z"/></svg></button>
    <button class="ibtn" id="favTop" aria-label="Favoris"><svg viewBox="0 0 24 24"><path d="M6 2h12a1 1 0 0 1 1 1v19l-7-4-7 4V3a1 1 0 0 1 1-1z"/></svg><span class="dot" id="favDot">0</span></button>
    <button class="ibtn" id="searchBtn" aria-label="Rechercher"><svg viewBox="0 0 24 24"><path d="M10 2a8 8 0 1 0 4.9 14.3l5.4 5.4 1.4-1.4-5.4-5.4A8 8 0 0 0 10 2zm0 2.5a5.5 5.5 0 1 1 0 11 5.5 5.5 0 0 1 0-11z"/></svg></button>
    <button class="ibtn" aria-label="Catégories" data-toast="Catégories"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="8" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/><circle cx="17" cy="17" r="4"/></svg></button>
    <button class="ibtn" aria-label="Notifications" data-toast="Aucune nouvelle notification"><svg viewBox="0 0 24 24"><path d="M12 2a1.6 1.6 0 0 1 1.6 1.6v.6A6.5 6.5 0 0 1 18.5 10.5V15l2 3.2v.8h-17v-.8l2-3.2v-4.5a6.5 6.5 0 0 1 4.9-6.3v-.6A1.6 1.6 0 0 1 12 2zm-2.5 18h5a2.5 2.5 0 0 1-5 0z"/></svg></button>
  </div>
  <div class="searchrow" id="searchRow"><input id="q" type="search" placeholder="Rechercher un produit…" aria-label="Rechercher"></div>
</header>

<main>
  <button class="allbtn" id="allBtn"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="8" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/><rect x="13" y="13" width="8" height="8" rx="2"/></svg>Tous les produits</button>
  <section class="grid" id="grid" aria-live="polite"></section>
  <section id="cartView" hidden aria-live="polite"></section>
  <section id="orderView" hidden></section>
  <section id="ordersView" hidden></section>
  <section id="detailView" hidden></section>
  <section id="accountView" hidden></section>
</main>

<nav aria-label="Navigation principale">
  <div class="nav-in" id="nav">
    <button class="on" data-tab="home"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="11" fill="#9b1560"/><path d="M12 5.5 5.5 11.3h2V18h3.2v-4.2h2.6V18h3.2v-6.7h2z" fill="#fff"/></svg><span>Accueil</span></button>
    <button data-tab="cart"><svg viewBox="0 0 24 24"><path fill="#9b1560" d="M2 3h3l.7 2.5H21l-2.2 8.2H8.2l.4 1.6H19v2H7.2L4 5H2zM9 20.5a1.5 1.5 0 1 0 0 .01zm9 0a1.5 1.5 0 1 0 0 .01z"/></svg><span>Panier</span><i class="cnt" id="cartCnt">0</i></button>
    <button data-tab="orders"><svg viewBox="0 0 24 24"><path fill="#e8a24a" d="M3 7l7-3 7 3v10l-7 3-7-3z"/><rect x="14" y="10" width="7" height="10" rx="1" fill="#f3e6a8"/><path d="M15.5 13h4M15.5 15.5h4M15.5 18h4" stroke="#7a9a3a" stroke-width="1.2"/></svg><span>Commandes</span></button>
    <button data-tab="search"><svg viewBox="0 0 24 24"><path fill="#9b1560" d="M10 2a8 8 0 1 0 4.9 14.3l5.4 5.4 1.4-1.4-5.4-5.4A8 8 0 0 0 10 2zm0 2.5a5.5 5.5 0 1 1 0 11 5.5 5.5 0 0 1 0-11z"/></svg><span>Chercher</span></button>
    <button data-tab="favs"><svg viewBox="0 0 24 24"><path fill="#9b1560" d="M12 21s-8-5.4-8-11.2A4.8 4.8 0 0 1 12 7a4.8 4.8 0 0 1 8 2.8C20 15.6 12 21 12 21z"/></svg><span>Favoris</span></button>
    <button data-tab="account"><svg viewBox="0 0 24 24"><path fill="#9b1560" d="M12 2 4 5v6c0 5 3.4 9 8 11 4.6-2 8-6 8-11V5z"/><circle cx="12" cy="10" r="2.6" fill="#fff"/><path d="M7.5 16c1-2.4 3-3 4.5-3s3.500.6 4.500 3c-1.200 1.200-2.800 2.200-4.500 2.800-1.700-.6-3.300-1.600-4.500-2.800z" fill="#fff"/></svg><span>Mon compte</span></button>
  </div>
</nav>
<div class="toast" id="toast" role="status"></div>

<script>
/* ===== Données : remplacez par vos produits (img = lien de l’image) ===== */
let PRODUCTS = [
  {id:"1",name:"Blender 3en1 Anesta 3 en 1",price:5950,stock:12,emoji:"🍹",bg:"linear-gradient(135deg,#2b2b2e,#5a4a3a)",img:""},
  {id:"2",name:"Blender 3en1 + hachoir Bunny Jumps",price:6200,stock:8,emoji:"🥤",bg:"linear-gradient(135deg,#7b3fb5,#e0463d)",img:""},
  {id:"3",name:"Presse-agrumes Matrix 120W",price:4200,stock:20,emoji:"🍊",bg:"linear-gradient(135deg,#bcd6ea,#f4b13c)",img:""},
  {id:"4",name:"TV Continental 40P simple",price:24500,stock:5,emoji:"📺",bg:"linear-gradient(135deg,#6a3a8e,#c4437f)",img:""},
  {id:"5",name:"Bouilloire électrique 2L",price:2900,stock:0,emoji:"☕",bg:"linear-gradient(135deg,#34495e,#7f9bb3)",img:""},
  {id:"6",name:"Ventilateur sur pied 18 pouces",price:5400,stock:14,emoji:"🌀",bg:"linear-gradient(135deg,#0f7b8a,#7fd1c4)",img:""}
];
const cap = p => (p.stock == null || p.stock === "") ? Infinity : Number(p.stock);
const avail = p => p.published !== false && cap(p) > 0;
const fmt = n => n.toString().replace(/\B(?=(\d{3})+(?!\d))/g,"\u202F") + " dz";
const $ = s => document.querySelector(s);
const grid = $("#grid");
const MAX_CART = 3; /* nombre maximum de produits différents dans le panier */
let favs = new Set(), cart = {}, query = "", onlyFav = false, tab = "home";

try{ favs = new Set(JSON.parse(localStorage.getItem("bz_favs")||"[]").map(String)); }catch(e){}
const saveFavs = () => { try{ localStorage.setItem("bz_favs", JSON.stringify([...favs])); }catch(e){} };

function toast(msg){
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toast.t); toast.t = setTimeout(()=>t.classList.remove("show"),1800);
}
const esc = s => s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function render(){
  $("#allBtn").lastChild.textContent = onlyFav ? "Mes favoris" : "Tous les produits";
  const list = PRODUCTS.filter(p =>
    p.name.toLowerCase().includes(query.toLowerCase()) && (!onlyFav || favs.has(p.id)));
  grid.innerHTML = list.length ? list.map(p => {
    const ok = avail(p);
    return `<article class="card">
      <div class="media" data-open="${p.id}" style="background:${p.bg}">
        ${p.img ? `<img src="${esc(p.img)}" alt="${esc(p.name)}" loading="lazy">` : `<span aria-hidden="true">${p.emoji}</span>`}
        <button class="fav ${favs.has(p.id)?"on":""}" data-fav="${p.id}" aria-label="Ajouter aux favoris" aria-pressed="${favs.has(p.id)}">
          <svg viewBox="0 0 24 24"><path d="M12 21s-8-5.4-8-11.2A4.8 4.8 0 0 1 12 7a4.8 4.8 0 0 1 8 2.800C20 15.600 12 21 12 21z"/></svg>
        </button>
      </div>
      <div class="info">
        <h3 class="name" data-open="${p.id}" title="${esc(p.name)}">${esc(p.name)}</h3>
        <div class="row"><span class="price">${fmt(p.price)}</span><span class="badge ${ok?"":"out"}">${ok?"Disponible":"Épuisé"}</span></div>
        <button class="buy" data-buy="${p.id}" ${ok?"":"disabled"}>
          <svg viewBox="0 0 24 24"><path d="M5 8h14l-1 12H6zM9 8V6a3 3 0 0 1 6 0v2"/></svg>Acheter
        </button>
      </div>
    </article>`;
  }).join("") : `<p class="empty">${onlyFav ? "Aucun favori pour le moment.<br>Touchez le cœur d’un produit pour l’ajouter." : "Aucun produit trouvé."}</p>`;
  const n = favs.size, d = $("#favDot"); d.textContent = n; d.classList.toggle("on", n>0);
}

grid.addEventListener("click", e => {
  const f = e.target.closest("[data-fav]"), b = e.target.closest("[data-buy]"), m = e.target.closest("[data-open]");
  if(m && !f && !b) return showDetail(m.dataset.open);
  if(f){
    const id = f.dataset.fav;
    favs.has(id) ? favs.delete(id) : favs.add(id);
    saveFavs(); render();
  }
  if(b){
    const p = PRODUCTS.find(x => x.id === b.dataset.buy);
    if(p.hasVariants) return showDetail(p.id);
    if(!cart[p.id] && Object.keys(cart).length >= MAX_CART) return toast("Maximum " + MAX_CART + " produits dans le panier");
    if((cart[p.id]||0) >= cap(p)) return toast("Stock maximum atteint");
    cart[p.id] = (cart[p.id]||0) + 1; updateCart();
    toast("Ajouté au panier : " + p.name);
  }
});

$("#searchBtn").onclick = () => {
  const row = $("#searchRow"); row.classList.toggle("open");
  if(row.classList.contains("open")) $("#q").focus(); else { $("#q").value = ""; query = ""; render(); }
};
$("#q").addEventListener("input", e => { query = e.target.value.trim(); render(); });
$("#favTop").onclick = () => { onlyFav = !onlyFav; toast(onlyFav ? "Favoris uniquement" : "Tous les produits"); render(); };
$("#allBtn").onclick = () => { onlyFav = false; query = ""; $("#q").value = ""; render(); window.scrollTo({top:0,behavior:"smooth"}); };
document.querySelectorAll("[data-toast]").forEach(b => b.onclick = () => toast(b.dataset.toast));
$("#nav").addEventListener("click", e => {
  const b = e.target.closest("button"); if(!b) return;
  const t = b.dataset.tab;
  if(t === "favs"){ onlyFav = true; showTab("home"); document.querySelectorAll("#nav button").forEach(x => x.classList.toggle("on", x === b)); render(); }
  else if(t === "home" || t === "cart" || t === "orders" || t === "account"){ onlyFav = false; showTab(t); render(); }
  else if(t === "search"){ showTab("home"); $("#searchRow").classList.add("open"); $("#q").focus(); }
  else toast(b.querySelector("span").textContent + " : bientôt disponible");
});
/* ===== Panier ===== */
const total = () => Object.values(cart).reduce((a,b) => a+b, 0);
function showTab(t){
  tab = t;
  document.querySelectorAll("#nav button").forEach(x => x.classList.toggle("on", x.dataset.tab === t));
  const c = t === "cart", od = t === "orders";
  const ac = t === "account";
  grid.hidden = c || od || ac; $("#allBtn").hidden = c || od || ac; $("#cartView").hidden = !c; $("#orderView").hidden = true; $("#ordersView").hidden = !od; $("#detailView").hidden = true; $("#accountView").hidden = !ac;
  if(ac) renderAccount();
  if(c) renderCart();
  if(od) renderOrders();
  window.scrollTo({top:0});
}
function updateCart(){
  const n = total(), c = $("#cartCnt");
  c.textContent = n; c.classList.toggle("on", n > 0);
  if(tab === "cart") renderCart();
}
function renderCart(){
  const ids = Object.keys(cart), v = $("#cartView");
  if(!ids.length){
    v.innerHTML = `<p class="empty">Votre panier est vide.<br>Ajoutez des produits depuis l’accueil.</p><button class="buy" data-go="home">Voir les produits</button>`;
    return;
  }
  let sum = 0;
  const rows = ids.map(id => {
    const p = PRODUCTS.find(x => x.id === id), q = cart[id]; sum += p.price * q;
    return `<div class="crow">
      <div class="cthumb" style="background:${p.bg}">${p.img ? `<img src="${esc(p.img)}" alt="">` : p.emoji}</div>
      <div class="cmid"><div class="cname">${esc(p.name)}</div><div class="cprice">${fmt(p.price * q)}</div>
        <div class="qty"><button data-dec="${id}" aria-label="Diminuer">−</button><b>${q}</b><button data-inc="${id}" aria-label="Augmenter" ${q >= cap(p) ? "disabled" : ""}>+</button></div></div>
      <button class="cdel" data-del="${id}" aria-label="Supprimer"><svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg></button>
    </div>`;
  }).join("");
  v.innerHTML = `<h2 class="cart-title">Mon panier <small style="font-weight:600;color:var(--muted);font-size:15px">(${ids.length}/${MAX_CART} produits)</small></h2>${rows}<div class="cart-sum"><span>Total</span><strong>${fmt(sum)}</strong></div><button class="buy" data-order>Commander</button>`;
}
$("#cartView").addEventListener("click", e => {
  const g = e.target.closest("[data-go]"), i = e.target.closest("[data-inc]"),
        d = e.target.closest("[data-dec]"), x = e.target.closest("[data-del]"), o = e.target.closest("[data-order]");
  if(g) showTab(g.dataset.go);
  if(i){ const id = i.dataset.inc, p = PRODUCTS.find(y => y.id === id); if(cart[id] < cap(p)) cart[id]++; updateCart(); }
  if(d){ const id = d.dataset.dec; if(--cart[id] <= 0) delete cart[id]; updateCart(); }
  if(x){ delete cart[x.dataset.del]; updateCart(); }
  if(o) showOrder();
});
/* ===== Commande (paiement à la livraison) ===== */
const WILAYAS = "Adrar,Chlef,Laghouat,Oum El Bouaghi,Batna,Béjaïa,Biskra,Béchar,Blida,Bouira,Tamanrasset,Tébessa,Tlemcen,Tiaret,Tizi Ouzou,Alger,Djelfa,Jijel,Sétif,Saïda,Skikda,Sidi Bel Abbès,Annaba,Guelma,Constantine,Médéa,Mostaganem,M’Sila,Mascara,Ouargla,Oran,El Bayadh,Illizi,Bordj Bou Arréridj,Boumerdès,El Tarf,Tindouf,Tissemsilt,El Oued,Khenchela,Souk Ahras,Tipaza,Mila,Aïn Defla,Naâma,Aïn Témouchent,Ghardaïa,Relizane,Timimoun,Bordj Badji Mokhtar,Ouled Djellal,Béni Abbès,In Salah,In Guezzam,Touggourt,Djanet,El M’Ghair,El Meniaa".split(",");
const cartSum = () => Object.keys(cart).reduce((a,id) => a + PRODUCTS.find(p => p.id == id).price * cart[id], 0);

function showOrder(){
  grid.hidden = true; $("#allBtn").hidden = true; $("#cartView").hidden = true; $("#detailView").hidden = true;
  const v = $("#orderView"); v.hidden = false; window.scrollTo({top:0});
  v.innerHTML = `<button class="back" data-back>‹ Retour au panier</button>
  <h2 class="cart-title">Confirmer la commande</h2>
  <form id="ofm" novalidate>
    <div class="fld"><label for="fn">Nom complet</label><input id="fn" autocomplete="name"><div class="err">Entrez votre nom complet.</div></div>
    <div class="fld"><label for="fp">Téléphone</label><input id="fp" type="tel" inputmode="numeric" autocomplete="tel" placeholder="05 / 06 / 07 XX XX XX XX"><div class="err">Numéro invalide (10 chiffres, commence par 05, 06 ou 07).</div></div>
    <div class="fld"><label for="fw">Wilaya</label><select id="fw"><option value="">Choisir la wilaya</option>${WILAYAS.map((w,i) => `<option value="${i+1}">${String(i+1).padStart(2,"0")} – ${w}</option>`).join("")}</select><div class="err">Choisissez votre wilaya.</div></div>
    <div class="fld"><label for="fc">Commune</label><input id="fc" autocomplete="address-level2"><div class="err">Entrez votre commune.</div></div>
    <div class="fld"><label for="fa">Adresse</label><input id="fa" autocomplete="street-address"><div class="err">Entrez votre adresse.</div></div>
    <div class="opts" role="radiogroup" aria-label="Mode de livraison">
      <label class="opt"><input type="radio" name="dl" value="home" checked><b>À domicile</b><span id="ph"></span></label>
      <label class="opt"><input type="radio" name="dl" value="office"><b>Bureau</b><span id="po"></span></label>
    </div>
    <div class="sumbox"><div><span>Produits</span><span>${fmt(cartSum())}</span></div><div><span>Livraison</span><span id="sdl"></span></div><div class="tot"><span>Total à payer</span><strong id="stt"></strong></div></div>
    ${getProfile().registered ? "" : `<label class="optin"><input type="checkbox" id="mkacc"> Créer un compte avec ces informations (facultatif)</label>`}
    <p class="cod">Paiement à la livraison</p>
    <button class="buy" type="submit">Confirmer la commande</button>
  </form>`;
  const f = $("#ofm"), W = $("#fw");
  const pr = getProfile();
  [["fn","name"],["fp","phone"],["fc","commune"],["fa","address"],["fw","wilaya"]].forEach(([id,k]) => { if(pr[k]) $("#" + id).value = pr[k]; });
  const mode = () => f.dl.value;
  const upd = () => {
    const hm = f.querySelector('input[value="home"]'), off = f.querySelector('input[value="office"]');
    if(!W.value){ $("#ph").textContent = ""; $("#po").textContent = ""; hm.disabled = off.disabled = false; $("#sdl").textContent = "–"; $("#stt").textContent = fmt(cartSum()); return; }
    const sh = cartShip(String(W.value).padStart(2,"0"));
    hm.disabled = sh.home == null; off.disabled = sh.office == null;
    $("#ph").textContent = sh.home == null ? "Indisponible" : fmt(sh.home);
    $("#po").textContent = sh.office == null ? "Indisponible" : fmt(sh.office);
    if(hm.checked && hm.disabled && !off.disabled) off.checked = true;
    if(off.checked && off.disabled && !hm.disabled) hm.checked = true;
    const d = sh[mode()];
    $("#sdl").textContent = d == null ? "Indisponible" : fmt(d);
    $("#stt").textContent = fmt(cartSum() + (d || 0));
  };
  W.onchange = upd; f.querySelectorAll("[name=dl]").forEach(r => r.onchange = upd); upd();
  f.addEventListener("submit", async e => {
    e.preventDefault();
    const rules = [["fn", x => x.trim().length >= 3], ["fp", x => /^0[567]\d{8}$/.test(normPhone(x))],
                   ["fw", x => x !== ""], ["fc", x => x.trim().length >= 2], ["fa", x => x.trim().length >= 4]];
    let first = null;
    rules.forEach(([id, ok]) => { const el = $("#" + id), bad = !ok(el.value); el.closest(".fld").classList.toggle("bad", bad); if(bad && !first) first = el; });
    if(first) return first.focus();
    const code = String(W.value).padStart(2,"0"), dm = mode(), sh = cartShip(code);
    if(sh[dm] == null){ toast("Livraison indisponible pour cette wilaya"); return W.focus(); }
    const phone = normPhone($("#fp").value), btn = f.querySelector('button[type="submit"]');
    const items = Object.keys(cart).map(id => { const p = PRODUCTS.find(x => x.id === id), o = optionsFor(p, code)[dm]; return { p, q: cart[id], ship: o.price, codes: o.codes }; });
    const info = { name: $("#fn").value.trim(), commune: $("#fc").value.trim(), address: $("#fa").value.trim(), mk: !!($("#mkacc") && $("#mkacc").checked) };
    btn.disabled = true; btn.textContent = "Envoi en cours…";
    const sent = []; let fail = "";
    for(const it of items){
      if(LIVE){
        const r = await sendToWorker({ customerName: info.name, customerPhone: phone, wilaya: WILAYAS_AR[+W.value - 1], address: info.address,
          product: it.p.nameAr || it.p.name, productId: it.p.id, quantity: it.q, price: it.p.price, shipping: it.ship,
          deliveryType: dm === "office" ? "المكتب" : "المنزل", shippingCompany: it.codes.map(c => CARRIERS[c] || c).join(" + "),
          total: it.p.price * it.q + it.ship, variant: "", deviceId: deviceId() });
        if(r.outcome !== "saved"){
          fail = r.outcome === "blocked" ? "Commande impossible depuis ce numéro ou cet appareil." : r.outcome === "rejected" ? (r.msg || "Données refusées, vérifiez le formulaire.") : "Connexion impossible, réessayez.";
          break;
        }
      }
      sent.push(it);
    }
    if(!sent.length){ btn.disabled = false; btn.textContent = "Confirmer la commande"; return toast(fail || "Panier vide"); }
    const order = { date: Date.now(), ref: "BZ-" + Date.now().toString().slice(-6), name: info.name, phone, wilaya: WILAYAS[+W.value - 1], commune: info.commune, address: info.address, delivery: dm,
      items: sent.map(i => ({ id: i.p.id, qty: i.q, name: i.p.name })), total: sent.reduce((a, i) => a + i.p.price * i.q + i.ship, 0) };
    sendOrder(order);
    if(info.mk){ try{ localStorage.setItem("bz_profile", JSON.stringify({ registered: true, name: info.name, phone, wilaya: String(+W.value), commune: info.commune, address: info.address })); }catch(err){} }
    sent.forEach(i => delete cart[i.p.id]); updateCart();
    const partial = fail ? `<p style="color:#c62828;font-weight:700">${sent.length} produit(s) sur ${items.length} commandé(s). ${esc(fail)}<br>Les autres restent dans votre panier.</p>` : "";
    v.innerHTML = `<div class="done"><div class="ok"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
      <h2>Commande confirmée</h2><p>Numéro de commande : <b>${order.ref}</b><br>Nous vous appelons au ${esc(order.phone)} pour confirmer la livraison.</p>${partial}
      <button class="buy" data-go="orders" style="width:100%">Voir mes commandes</button>
      <button class="back" data-go="home">Continuer mes achats</button></div>`;
    window.scrollTo({top:0});
  });
}

}

/* ===== Mes commandes ===== */
const getOrders = () => { try{ return JSON.parse(localStorage.getItem("bz_orders")||"[]"); }catch(e){ return []; } };
const setOrders = a => { try{ localStorage.setItem("bz_orders", JSON.stringify(a)); }catch(e){} };
function renderOrders(){
  const v = $("#ordersView"), list = getOrders().slice().reverse();
  if(!list.length){
    v.innerHTML = `<p class="empty">Vous n’avez pas encore de commande.</p><button class="buy" data-go="home">Voir les produits</button>`;
    return;
  }
  v.innerHTML = `<h2 class="cart-title">Mes commandes</h2>` + list.map(o => {
    const cancelled = o.status === "cancelled";
    const date = o.date ? new Date(o.date).toLocaleDateString("fr-FR",{day:"2-digit",month:"short",year:"numeric"}) : "";
    const items = o.items.map(i => { const p = PRODUCTS.find(x => x.id === i.id); return `<div><span>${esc(i.name || (p ? p.name : "Produit"))}</span><span>×${i.qty}</span></div>`; }).join("");
    return `<article class="ocard">
      <div class="otop"><div><b>${esc(o.ref)}</b><div class="odate">${date}</div></div><span class="st ${cancelled ? "c" : ""}">${cancelled ? "Annulée" : "En attente"}</span></div>
      <div class="oitems">${items}</div>
      <div class="oloc">${esc(o.wilaya)}, ${esc(o.commune)} · ${o.delivery === "office" ? "Bureau" : "À domicile"}</div>
      <div class="obot"><strong>${fmt(o.total)}</strong>${cancelled ? "" : `<button class="ocancel" data-cancel="${esc(o.ref)}">Annuler</button>`}</div>

}
$("#ordersView").addEventListener("click", e => {

let dq = 1;
function showDetail(id){
  const p = PRODUCTS.find(x => x.id === id); dq = 1;
  grid.hidden = true; $("#allBtn").hidden = true;
  ["#cartView","#orderView","#ordersView"].forEach(s => $(s).hidden = true);

  const ok = avail(p);
  v.innerHTML = `<button class="back" data-back>‹ Retour</button>
  <div class="dwrap">
    <div class="dmedia" style="background:${p.bg}">${p.img ? `<img src="${esc(p.img)}" alt="${esc(p.name)}">` : p.emoji}</div>
    <div class="dinfo">
      <h2 class="dname">${esc(p.name)}</h2>
      <div class="dline"><span class="dprice">${fmt(p.price)}</span><span class="badge ${ok ? "" : "out"}">${ok ? "Disponible" : "Épuisé"}</span>${ok && cap(p) <= 5 ? `<span class="low">Plus que ${p.stock} en stock</span>` : ""}</div>
      ${p.hasVariants ? `<a class="vlink" href="${BAZAR.siteBase}/product.html?id=${encodeURIComponent(p.id)}">Choisir couleur / taille sur le site ›</a>` : ""}
      <p class="ddesc">${esc(p.desc || "Produit de qualité, garanti. Livraison dans toute l’Algérie, paiement à la réception.")}</p>
      ${ok ? `<div class="dqty"><span>Quantité</span><div class="qty"><button data-dq="-1" aria-label="Diminuer">−</button><b id="dqv">1</b><button data-dq="1" aria-label="Augmenter">+</button></div></div>
      <div class="dact">
        <button class="buy" data-dorder>Commander maintenant</button>
        <button class="buy alt" data-dadd><svg viewBox="0 0 24 24"><path d="M5 8h14l-1 12H6zM9 8V6a3 3 0 0 1 6 0v2"/></svg>Ajouter au panier</button>
      </div>` : ""}
    </div>
  </div>`;
}
function addDetail(){
  const id = $("#detailView").dataset.id, p = PRODUCTS.find(x => x.id === id);
  if(p.hasVariants){ toast("Choisissez la couleur / taille sur le site"); return false; }
  if(!cart[id] && Object.keys(cart).length >= MAX_CART){ toast("Maximum " + MAX_CART + " produits dans le panier"); return false; }
  cart[id] = Math.min(cap(p), (cart[id] || 0) + dq); updateCart(); return true;
}
$("#detailView").addEventListener("click", e => {
  const id = $("#detailView").dataset.id, p = PRODUCTS.find(x => x.id === id), q = e.target.closest("[data-dq]");
  if(e.target.closest("[data-back]")) showTab("home");
  if(q){
    const n = dq + +q.dataset.dq;
    if(n > cap(p)) toast("Stock maximum atteint"); else if(n >= 1) dq = n;
    $("#dqv").textContent = dq;
  }
  if(e.target.closest("[data-dadd]") && addDetail()){ toast("Ajouté au panier : " + p.name); }
  if(e.target.closest("[data-dorder]") && addDetail()){ document.querySelectorAll("#nav button").forEach(x => x.classList.toggle("on", x.dataset.tab === "cart")); showOrder(); }
});

function fv(v){
  if(!v) return null;
  if("stringValue" in v) return v.stringValue; if("integerValue" in v) return Number(v.integerValue);
  if("doubleValue" in v) return v.doubleValue; if("booleanValue" in v) return v.booleanValue;
  if("timestampValue" in v) return v.timestampValue;
  if(v.arrayValue) return (v.arrayValue.values || []).map(fv);
  if(v.mapValue){ const o = {}; for(const k in (v.mapValue.fields || {})) o[k] = fv(v.mapValue.fields[k]); return o; }
  return null;
}
function fdoc(d){ const o = {}; for(const k in (d.fields || {})) o[k] = fv(d.fields[k]); o.__id = d.name.split("/").pop(); return o; }
async function fsGet(path){
  const r = await fetch(`${FS}/${path}${path.includes("?") ? "&" : "?"}key=${BAZAR.apiKey}`);

/* ----- livraison (même logique que product.html) ----- */
const carrierCodes = v => String(v || "").split(",").map(s => s.trim()).filter(Boolean);
function carrierAvail(prod, wil){
  const P = carrierCodes(prod), W = carrierCodes(wil);
  if(!P.length) return { ok: true, codes: W };
  if(!W.length) return { ok: true, codes: P };
  const i = P.filter(c => W.includes(c)); return { ok: i.length > 0, codes: i };
}
function optionsFor(p, code){
  const o = {}, rate = RATES[code], m = p.deliveryMethod || null;
  let hp = null, hc = "", op = null, oc = "";
  if(rate){ hp = (rate.home === "" || rate.home == null) ? null : Number(rate.home); hc = rate.homeCompany || ""; }
  else if(LEG_HOME[code] != null) hp = LEG_HOME[code];
  if((!m || m === "home") && hp != null){ const av = carrierAvail(p.shippingHome, hc); if(av.ok) o.home = { price: hp, codes: av.codes }; }
  if(rate){ op = (rate.office === "" || rate.office == null) ? null : Number(rate.office); oc = rate.officeCompany || ""; }
  if(op == null && LEG_OFFICE[code] != null && LEG_OFFICE[code] !== ""){ op = LEG_OFFICE[code]; oc = oc || "dhd"; }
  if((!m || m === "office") && op != null){ const av = carrierAvail(p.shippingOffice, oc); if(av.ok) o.office = { price: op, codes: av.codes }; }
  return o;
}
/* un colis par produit : le prix de livraison est celui de chaque commande envoyée au Worker */
function cartShip(code){
  const res = { home: 0, office: 0 };
  Object.keys(cart).forEach(id => {
    const o = optionsFor(PRODUCTS.find(p => p.id === id), code);
    ["home", "office"].forEach(k => { if(res[k] == null) return; res[k] = o[k] ? res[k] + o[k].price : null; });
  });

}

function deviceId(){

async function sendToWorker(payload){
  const ctrl = new AbortController(), t = setTimeout(() => ctrl.abort(), 15000);
  try{
    const r = await fetch(BAZAR.worker + "/create-order", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload), signal: ctrl.signal });
    const b = await r.json().catch(() => null);
    if(r.ok && b && b.ok === true && b.id) return { outcome: "saved", id: b.id };
    const code = (b && b.code) || String(r.status);
    if(code === "ip_blocked" || code === "phone_blocked") return { outcome: "blocked", code };
    if(r.status === 400) return { outcome: "rejected", code, msg: (b && typeof b.error === "string") ? b.error : "" };
    return { outcome: "unavailable", code };
  }catch(e){ return { outcome: "unavailable", code: "network" }; }
  finally{ clearTimeout(t); }
}
