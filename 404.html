<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="robots" content="noindex,follow"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests"><title>Bazar Dzair</title></head><body><p id="msg">جارٍ تحويل الصفحة...</p><script>
(function(){
 // الصفحة تُحوَّل فورًا ولا تبقى ظاهرة، لكن نطابق لغتها مع تفضيل الزبون المحفوظ
 // (نفس مفتاح localStorage "bazarLang" الذي يستخدمه i18n.js) دون تحميل أي ملف إضافي،
 // حتى لا نُبطئ التحويل. هذا لا يمس نظام الطلبات أو Telegram إطلاقًا.
 try{
   if(localStorage.getItem("bazarLang")==="fr"){
     document.documentElement.setAttribute("lang","fr");
     document.documentElement.setAttribute("dir","ltr");
     var m=document.getElementById("msg");
     if(m) m.textContent="Redirection en cours...";
   }
 }catch(_e){}
 const p=decodeURIComponent(location.pathname);
 const map={
  "/category/أدوات/":"/category/tools/",
  "/category/ادوات/":"/category/tools/",
  "/category/هواتف/":"/category/telephones/",
  "/category/هاتف/":"/category/telephones/"
 };
 // إعادة تحميل رابط تصنيف بلا مجلد ثابت مطابق (/product-category/xxx/): نفتح التصنيف في المتجر بدل الرئيسية
 // ✅ تحصين إضافي: cm[1]/pm[1] مصدرهما مباشرة من location.pathname (غير مُرمَّز)، وإدراجهما
 // خامًا داخل رابط تحويل جديد كان يسمح لجزء المسار (لو احتوى &, #, = ...) بحقن معاملات
 // إضافية فرابط الوجهة (مثال: /product/x&evil=1 يعيد التوجيه فعليًا إلى
 // /product.html?id=x&evil=1). لا يوجد استغلال فعلي حاليًا (product.html يقرأ id فقط)،
 // لكن ترميزها بـ encodeURIComponent يمنع أي مفاجأة مستقبلية بدون أي أثر على الروابط السليمة.
 const cm=location.pathname.match(/^\/(?:product-category|category)\/([^\/]+)\/?/);
 if(cm){
   // location.pathname يكون مُرمَّزًا (%D8%A7...) لأي رابط عربي قديم؛ لو مرّرناه كما هو إلى encodeURIComponent
   // يُرمَّز مرتين فلا يجد index.html أي فئة مطابقة. لذلك نفكّ الترميز أولًا ثم نرمّز مرة واحدة.
   let seg=cm[1];
   try{seg=decodeURIComponent(seg);}catch(_e){}
   location.replace("/?category="+encodeURIComponent(seg));return;
 }
 if(map[p]){location.replace(map[p]);return;}
 // رابط منتج فرنسي بلا صفحة ثابتة: نفس المعالجة أدناه، مع الحفاظ على lang=fr حتى لا تُفتح
 // الصفحة الديناميكية بالعربية افتراضيًا. يجب أن يُختبر قبل النمط العربي لأن /fr/product/
 // يطابق أيضًا لو حذفنا الشرطة الأولى بالخطأ؛ الفحص هنا صريح فلا التباس.
 const pmFr=location.pathname.match(/^\/fr\/product\/([^\/]+)\/?$/);
 if(pmFr){location.replace("/product.html?id="+encodeURIComponent(pmFr[1])+"&lang=fr");return;}
 // رابط منتج بلا صفحة ثابتة (منتج جديد لم تُولَّد صفحته بعد، أو رابط قديم): نفتحه في الصفحة الديناميكية بدل الرئيسية.
 const pm=location.pathname.match(/^\/product\/([^\/]+)\/?$/);
 if(pm){location.replace("/product.html?id="+encodeURIComponent(pm[1]));return;}
 location.replace("/");
})();
</script></body></html>
