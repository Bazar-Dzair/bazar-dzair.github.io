name: إصلاح وصف المشاركة لصفحات المنتجات

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: تطبيق التعديل
        run: |
          python3 - <<'PYEOF'
          import glob, re
          files = glob.glob('product/*/index.html') + glob.glob('fr/product/*/index.html')
          changed = 0
          for p in files:
              s = open(p, encoding='utf-8').read()
              o = re.search(r'<meta[^>]*property="og:description"[^>]*content="([^"]*)"', s)
              if not o:
                  continue
              t2, k = re.subn(r'(<meta[^>]*name="twitter:description"[^>]*content=")[^"]*(")',
                              lambda m: m.group(1) + o.group(1) + m.group(2), s, count=1)
              if k and t2 != s:
                  open(p, 'w', encoding='utf-8').write(t2)
                  changed += 1
          print(f'files scanned={len(files)} changed={changed}')
          PYEOF

      - name: حفظ التغييرات
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add product fr/product
          git diff --cached --quiet || git commit -m "تحديث وصف المشاركة لصفحات المنتجات"
          git push
