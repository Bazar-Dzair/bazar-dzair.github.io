name: فحص مفاتيح الترجمة

# يفشل التشغيل إن استُعمل مفتاح ترجمة في الصفحات دون تعريفه في i18n.js أو product-app.js،
# فيُكتشف الخطأ قبل أن يرى الزبون اسم المفتاح الخام (مثل checkout_policy_link).
on:
  push:
    paths: ['*.html', 'i18n.js', 'product-app.js', 'scripts/check_i18n.py']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check_i18n.py
