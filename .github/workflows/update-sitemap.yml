name: Generate SEO product pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: مزامنة مع آخر main قبل التوليد
        run: |
          git fetch origin main
          git rebase origin/main

      - name: توليد صفحات المنتجات والتصنيفات (محتوى فريد لكل صفحة)
        run: python3 scripts/generate_static_products.py

      - name: حقن أكواد الإضافات (Google Analytics / GTM / Meta / TikTok / Search Console) في مصدر HTML مباشرة
        run: python3 scripts/inject_addons.py

      - name: رفع التحديثات تلقائيًا
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add product product-category sitemap.xml sitemap-products.xml sitemap-categories.xml index.html product.html
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "chore: تحديث صفحات SEO وإضافات التتبع تلقائيًا [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
