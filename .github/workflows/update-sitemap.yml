name: حقن أكواد الإضافات (Analytics/GTM/Meta/TikTok)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: مزامنة مع آخر main قبل الحقن
        run: |
          git fetch origin main
          git rebase origin/main

      - name: حقن أكواد الإضافات (Google Analytics / GTM / Meta / TikTok / Search Console) في مصدر HTML مباشرة
        run: python3 scripts/inject_addons.py

      # ⚠️ تم استبعاد product.html من قائمة git add عمدًا.
      # هذا الملف يحتوي الآن كود Cloudflare Turnstile الذي أضيف يدويًا،
      # ولا يجب أن تتم الكتابة فوقه تلقائيًا. إذا احتجت لاحقًا تحديث
      # product.html تلقائيًا مجددًا (مثلاً بعد التأكد أن السكربتات
      # تحافظ على Turnstile)، أعد إضافته هنا يدويًا.
      - name: رفع التحديثات تلقائيًا
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "chore: تحديث أكواد الإضافات تلقائيًا [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
