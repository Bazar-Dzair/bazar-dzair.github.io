name: Rebuild static product pages and sitemap

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'
  push:
    branches: [main]
    paths:
      - 'product.html'

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync with latest main
        run: |
          git fetch origin main
          git rebase origin/main

      - name: Regenerate static product/category pages and sitemaps
        run: python3 scripts/generate_static_products.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add product product-category sitemap.xml sitemap-products.xml sitemap-categories.xml
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "chore: rebuild static product pages and sitemap from Firestore"
          git pull --rebase origin main
          git push origin HEAD:main
          
