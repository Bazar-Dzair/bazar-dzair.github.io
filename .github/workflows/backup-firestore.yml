name: نسخ احتياطي أسبوعي لقاعدة Firestore

# ⚠️ هذا الملف وحده لا يكفي: يحتاج إعدادًا لمرة واحدة في Google Cloud قبل أن يعمل
# (إنشاء حساب خدمة + صلاحيات + Bucket تخزين + سرّين في إعدادات المستودع).
# راجع شرح الخطوات في الرسالة المرافقة لهذا الملف.
#
# المبدأ: النسخة الاحتياطية تُصدَّر مباشرة من Firestore إلى Google Cloud Storage
# (داخل حساب Google الخاص بك فقط) — لا تمر أبدًا عبر هذا المستودع العام على GitHub
# ولا تُكتب في أي commit. هذا مهم لأن الطلبات (orders) تحتوي أسماء وهواتف وعناوين
# زبائن حقيقيين، ولا يجوز أن تُنسخ إلى مستودع عام إطلاقًا.

on:
  schedule:
    - cron: '30 2 * * 0'  # كل يوم أحد الساعة 02:30 UTC (~03:30 بتوقيت الجزائر)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firestore-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - id: auth
        name: تسجيل الدخول إلى Google Cloud بحساب الخدمة
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIRESTORE_BACKUP_KEY }}'

      - name: تجهيز أداة gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: تصدير قاعدة Firestore كاملة (كل المجموعات) إلى Cloud Storage
        run: |
          set -e
          DEST="gs://${{ secrets.FIRESTORE_BACKUP_BUCKET }}/backups/$(date -u +%Y-%m-%d_%H%M)"
          echo "تصدير إلى: $DEST"
          gcloud firestore export "$DEST" --project=bazar-dzair-33816
