name: Generate SEO product and category pages

on:
  # تشغيل يدوي، وهو أيضًا ما يستدعيه الـ Worker تلقائيًا بعد حفظ البانر من لوحة التحكم
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
  # إعادة التوليد تلقائيًا عند رفع أي ملف تعتمد عليه الصفحات المولَّدة (السكربت نفسه، أو قالب product.html
  # الذي تُبنى منه كل صفحة منتج، أو هذا الملف). بدون هذا كان رفع هذه الملفات لا يغيّر الصفحات المنشورة
  # حتى التشغيل المجدول التالي، فتبقى روابط جديدة (مثل /product/<slug>/) تعطي 404 لساعات.
  # لا حلقة تشغيل: الـ push الذي يجريه هذا الـ workflow بـ GITHUB_TOKEN لا يُطلق workflows أخرى.
  push:
    branches: [main]
    paths:
      - 'scripts/generate_static_products.py'
      - 'product.html'
      - '.github/workflows/generate-seo-pages.yml'

permissions:
  contents: write

# تشغيل واحد فقط في كل مرة: إذا حُفظ البانر مرتين متتاليتين، ينتظر الثاني انتهاء الأول
# (لا نلغي التشغيل الجاري حتى لا يتوقف في منتصف الكتابة/الـ push).
concurrency:
  group: main-pages-write
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Generate and commit static SEO pages from Firestore
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          for attempt in 1 2 3; do
            python3 scripts/generate_static_products.py

            # index.html مُضاف عمدًا: السكربت يحدّث فيه بانر الصفحة الرئيسية (og:image / twitter:image /
            # heroImg) وبطاقات المنتجات والفئات. غيابه من هنا كان السبب في أن أي تغيير لا يصل للمستودع.
            # fr/ مُضاف هنا: مرحلة 2 من إصلاح SEO الفرنسية تولّد /fr/product/<slug>/ (نسخة
          # فرنسية ثابتة حقيقية من صفحة المنتج). بدون إضافته هنا لن تُدفَع هذه الملفات
          # المولَّدة أبدًا إلى main رغم إنشائها محليًا في كل تشغيل.
          git add index.html product product-category fr sitemap.xml sitemap-products.xml sitemap-categories.xml
            git rm -r --cached --ignore-unmatch category >/dev/null 2>&1 || true

            if git diff --cached --quiet; then
              echo 'No SEO changes.'
              exit 0
            fi

            git commit -m 'chore: regenerate SEO product and category pages'

            if git push origin HEAD:main; then
              exit 0
            fi

            # الـ push رُفض لأن main تحرّكت أثناء التشغيل (مثلًا workflow حقن الإضافات أو commit يدوي).
            # الملفات المولّدة قابلة لإعادة الإنشاء بالكامل، فالأسلم: نتزامن مع آخر main ونعيد التوليد
            # بدل rebase قد ينتهي بتعارض في index.html.
            echo "Push rejected (attempt $attempt/3): re-syncing with origin/main and regenerating..."
            git fetch origin main
            git reset --hard origin/main
          done

          echo 'Failed to push SEO changes after 3 attempts.' >&2
          exit 1
