          # ---------- ملفات Gradle ----------
          cat > "$A/settings.gradle" <<'EOF_X'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = 'BazarDzair'
          include ':app'
          EOF_X

          cat > "$A/build.gradle" <<'EOF_X'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF_X

          cat > "$A/gradle.properties" <<'EOF_X'
          org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
          android.useAndroidX=false
          android.nonTransitiveRClass=true
          EOF_X

          cat > "$A/app/build.gradle" <<'EOF_X'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.bazardzair.app'
              compileSdk 34

              defaultConfig {
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
              }

              buildFeatures {
                  buildConfig true
              }

              signingConfigs {
                  release {
                      storeFile file('../release.keystore')
                      storePassword 'bazardzair'
                      keyAlias 'bazar'
                      keyPassword 'bazardzair'
                  }
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      signingConfig signingConfigs.release
                  }
              }

              flavorDimensions 'app'
              productFlavors {
                  store {
                      dimension 'app'
                      applicationId 'com.bazardzair.store'
                      resValue 'string', 'app_name', 'Bazar Dzair'
                      buildConfigField 'String', 'START_URL', '"https://bazar-dzair.github.io/"'
                  }
                  admin {
                      dimension 'app'
                      applicationId 'com.bazardzair.admin'
                      resValue 'string', 'app_name', 'Bazar Admin'
                      buildConfigField 'String', 'START_URL', '"https://bazar-dzair.github.io/admin.html"'
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              lint {
                  checkReleaseBuilds false
                  abortOnError false
              }
          }
          EOF_X

          # ---------- AndroidManifest + الموارد ----------
          cat > "$A/app/src/main/AndroidManifest.xml" <<'EOF_X'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />

              <application
                  android:label="@string/app_name"
                  android:icon="@mipmap/ic_launcher"
                  android:allowBackup="false"
                  android:usesCleartextTraffic="false"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:windowSoftInputMode="adjustResize"
                      android:configChanges="orientation|screenSize|smallestScreenSize|screenLayout|keyboardHidden|uiMode">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF_X

          cat > "$A/app/src/main/res/values/styles.xml" <<'EOF_X'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="android:Theme.Material.Light.NoActionBar">
                  <item name="android:statusBarColor">@color/brand</item>
                  <item name="android:navigationBarColor">@color/brand</item>
                  <item name="android:windowBackground">@color/brand</item>
              </style>
          </resources>
          EOF_X

          cat > "$A/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml" <<'EOF_X'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/brand" />
              <foreground android:drawable="@mipmap/ic_launcher_fg" />
          </adaptive-icon>
          EOF_X

          printf '<?xml version="1.0" encoding="utf-8"?>\n<resources><color name="brand">#061e3d</color></resources>\n' > "$A/app/src/store/res/values/brand.xml"
          printf '<?xml version="1.0" encoding="utf-8"?>\n<resources><color name="brand">#182536</color></resources>\n' > "$A/app/src/admin/res/values/brand.xml"

          # الأيقونات: من نفس أيقونات المستودع (بدون إنشاء شعار جديد)
          cp icons/icon-192.png "$A/app/src/store/res/mipmap-xxxhdpi/ic_launcher.png"
          cp icons/icon-maskable-512.png "$A/app/src/store/res/mipmap-xxxhdpi/ic_launcher_fg.png"
          cp icons/admin-192.png "$A/app/src/admin/res/mipmap-xxxhdpi/ic_launcher.png"
          cp icons/admin-maskable-512.png "$A/app/src/admin/res/mipmap-xxxhdpi/ic_launcher_fg.png"

          # صفحة "لا يوجد اتصال" داخل التطبيق
          cat > "$A/app/src/main/assets/offline.html" <<'EOF_X'
          <!doctype html>
          <html lang="ar" dir="rtl"><head><meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <title>Bazar Dzair</title>
          <style>
          body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;box-sizing:border-box;background:#061e3d;color:#fff;font-family:sans-serif;text-align:center}
          h1{font-size:21px;margin:0 0 8px}p{margin:0 0 6px;color:#cfd8e6;line-height:1.7}
          a{display:block;margin-top:22px;padding:14px;border-radius:12px;background:#ff6a00;color:#fff;font-weight:700;text-decoration:none;font-size:16px}
          </style></head><body><div>
          <h1>لا يوجد اتصال بالإنترنت</h1>
          <p>تأكد من اتصالك ثم أعد المحاولة.</p>
          <p dir="ltr">Pas de connexion Internet. Vérifiez votre connexion puis réessayez.</p>
          <a href="bazar-retry://go">إعادة المحاولة / Réessayer</a>
          </div></body></html>
          EOF_X

          # ---------- الشاشة الرئيسية: WebView كامل الشاشة يفتح الموقع ----------
          cat > "$A/app/src/main/java/com/bazardzair/app/MainActivity.java" <<'EOF_X'
          package com.bazardzair.app;

          import android.app.Activity;
          import android.content.Intent;
          import android.graphics.Color;
          import android.net.Uri;
          import android.os.Bundle;
          import android.view.ViewGroup;
          import android.webkit.CookieManager;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceError;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {

              private static final String HOST = "bazar-dzair.github.io";
              private static final int FILE_REQ = 1001;

              private WebView web;
              private ValueCallback<Uri[]> fileCb;

              @Override
              protected void onCreate(Bundle state) {
                  super.onCreate(state);

                  web = new WebView(this);
                  web.setLayoutParams(new ViewGroup.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT));
                  web.setBackgroundColor(Color.TRANSPARENT);
                  setContentView(web);

                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setDatabaseEnabled(true);
                  s.setUserAgentString(s.getUserAgentString() + " BazarDzairApp/1.0");
                  CookieManager.getInstance().setAcceptCookie(true);

                  web.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                          Uri u = request.getUrl();
                          String scheme = u.getScheme();
                          if ("bazar-retry".equals(scheme)) {
                              view.loadUrl(BuildConfig.START_URL);
                              return true;
                          }
                          if ("file".equals(scheme) || "about".equals(scheme)) {
                              return false;
                          }
                          if (("https".equals(scheme) || "http".equals(scheme)) && HOST.equals(u.getHost())) {
                              return false;
                          }
                          openExternal(u);
                          return true;
                      }

                      @Override
                      public void onReceivedError(WebView view, WebResourceRequest request, WebResourceError error) {
                          if (request.isForMainFrame()) {
                              view.loadUrl("file:///android_asset/offline.html");
                          }
                      }
                  });

                  web.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public boolean onShowFileChooser(WebView view, ValueCallback<Uri[]> callback,
                                                       FileChooserParams params) {
                          if (fileCb != null) {
                              fileCb.onReceiveValue(null);
                          }
                          fileCb = callback;
                          try {
                              startActivityForResult(params.createIntent(), FILE_REQ);
                          } catch (Exception e) {
                              fileCb = null;
                              return false;
                          }
                          return true;
                      }
                  });

                  web.setDownloadListener((url, userAgent, contentDisposition, mimeType, length) ->
                          openExternal(Uri.parse(url)));

                  if (state == null) {
                      web.loadUrl(BuildConfig.START_URL);
                  } else {
                      web.restoreState(state);
                  }
              }

              private void openExternal(Uri uri) {
                  try {
                      startActivity(new Intent(Intent.ACTION_VIEW, uri));
                  } catch (Exception ignored) {
                  }
              }

              @Override
              protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  if (requestCode == FILE_REQ && fileCb != null) {
                      fileCb.onReceiveValue(WebChromeClient.FileChooserParams.parseResult(resultCode, data));
                      fileCb = null;
                      return;
                  }
                  super.onActivityResult(requestCode, resultCode, data);
              }

              @Override
              protected void onSaveInstanceState(Bundle out) {
                  super.onSaveInstanceState(out);
                  web.saveState(out);
              }

              @Override
              public void onBackPressed() {
                  if (web.canGoBack()) {
                      web.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }

              @Override
              protected void onPause() {
                  web.onPause();
                  super.onPause();
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  web.onResume();
              }

              @Override
              protected void onDestroy() {
                  web.destroy();
                  super.onDestroy();
              }
          }
          EOF_X
          echo "project generated in $A"

      - name: بناء التطبيقين
        working-directory: android-build
        run: gradle assembleStoreRelease assembleAdminRelease --no-daemon --stacktrace

      - name: تجميع ملفات APK
        run: |
          mkdir -p out
          cp android-build/app/build/outputs/apk/store/release/app-store-release.apk out/Bazar-Dzair.apk
          cp android-build/app/build/outputs/apk/admin/release/app-admin-release.apk out/Bazar-Admin.apk
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: bazar-apks
          path: out/*.apk

      - name: نشر الملفات في Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apps
          name: تطبيقات Bazar Dzair (APK)
          body: |
            حمّل الملف المناسب ثبّته على هاتفك Android:
            - Bazar-Dzair.apk : تطبيق المتجر
            - Bazar-Admin.apk : تطبيق الإدارة
          files: out/*.apk
          make_latest: true
