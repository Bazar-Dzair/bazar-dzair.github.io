name: بناء تطبيقات أندرويد (APK)

# يبني تطبيقين حقيقيين من موقعك: Bazar Dzair (المتجر) و Bazar Admin (الإدارة)
# شغّله يدويًا: Actions ← بناء تطبيقات أندرويد (APK) ← Run workflow
# النتيجة تظهر في Releases (الشريط الجانبي للمستودع) كملفات APK جاهزة للتحميل.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: تجهيز Android SDK
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: توليد مشروع الأندرويد
        run: |
          set -euo pipefail
          A=android-build
          rm -rf "$A"
          mkdir -p "$A/app/src/main/java/com/bazardzair/app" "$A/app/src/main/res/values" "$A/app/src/main/res/mipmap-anydpi-v26" "$A/app/src/main/assets"
          for f in store admin; do mkdir -p "$A/app/src/$f/res/values" "$A/app/src/$f/res/mipmap-xxxhdpi"; done

