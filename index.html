<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<link rel="icon" href="logo.svg" type="image/svg+xml">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bazar Dzair | متجر إلكتروني جزائري</title>
<meta name="description" content="متجر إلكتروني جزائري يوفر منتجات متنوعة وأسعار مناسبة مع توصيل لجميع الولايات — الدفع عند الاستلام.">
<meta name="theme-color" content="#071b33">
<script src="addons.js"></script>
<link rel="canonical" href="https://bazar-dzair.github.io/">
<meta property="og:type" content="website">
<meta property="og:locale" content="ar_DZ">
<meta property="og:site_name" content="Bazar Dzair">
<meta property="og:title" content="Bazar Dzair | متجر إلكتروني جزائري">
<meta property="og:description" content="منتجات متنوعة، أسعار مناسبة، توصيل لجميع الولايات — الدفع عند الاستلام.">

<style>
:root{--navy:#071b33;--orange:#ff6a00;--green:#16a34a;--bg:#f5f7fa;--text:#172033;--muted:#667085;--border:#e4e7ec}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Tahoma,sans-serif;line-height:1.6}
button,input,select{font:inherit}button{cursor:pointer}a{text-decoration:none;color:inherit}
header{background:var(--navy);color:#fff;position:sticky;top:0;z-index:20;box-shadow:0 3px 15px #0002}
.header-in{max-width:1180px;width:94%;margin:auto;min-height:64px;display:flex;align-items:center;justify-content:space-between;gap:14px}
.brand{font-size:21px;font-weight:900;color:#fff}
.hero{max-width:1180px;width:94%;margin:18px auto 6px}
.hero-box{background:linear-gradient(120deg,var(--navy),#12306b);color:#fff;border-radius:22px;padding:34px 30px}
.hero h1{margin:0 0 8px;font-size:28px}.hero p{margin:0;color:#cdd8ef;max-width:520px}
.search{margin:20px auto;max-width:1180px;width:94%}
.search input{width:100%;padding:15px 18px;border:1px solid var(--border);border-radius:13px;font-size:16px;outline:none;background:#fff;box-shadow:0 3px 14px #00000006}
.search input:focus{border-color:var(--orange)}
.cats{max-width:1180px;width:94%;margin:0 auto 18px;display:flex;gap:9px;flex-wrap:wrap}
.cat{background:#fff;border:1px solid var(--border);border-radius:999px;padding:9px 16px;cursor:pointer;font-weight:700;color:#444}
.cat.active{background:var(--navy);color:#fff;border-color:var(--navy)}
.cat:hover{background:#eef1f6}
main{max-width:1180px;width:94%;margin:10px auto 70px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.card{background:#fff;border:1px solid var(--border);border-radius:18px;overflow:hidden;transition:.18s;display:flex;flex-direction:column}
.card:hover{box-shadow:0 10px 28px #0000000e;transform:translateY(-2px)}
.card .imgbox{aspect-ratio:1/1;background:#f8fafc;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}
.card .imgbox img{width:100%;height:100%;object-fit:contain;padding:10px}
.card .badge{position:absolute;top:10px;right:10px;background:var(--orange);color:#fff;font-size:11px;font-weight:700;padding:4px 9px;border-radius:8px}
.card .body{padding:14px 15px 16px;display:flex;flex-direction:column;gap:8px;flex:1}
.card h3{margin:0;font-size:15px;color:#222;line-height:1.5}
.card h3 a{color:#222}
.card .price{font-size:19px;font-weight:900;color:var(--orange)}
.card .buy{margin-top:auto;background:var(--green);color:#fff;border:0;border-radius:10px;padding:11px;font-weight:800;text-align:center}
.card .buy:hover{filter:brightness(.96)}
.loading,.empty{text-align:center;padding:70px;color:var(--muted);background:#fff;border:1px solid var(--border);border-radius:18px}
footer{background:var(--navy);color:#cdd6ef;padding:26px 0;text-align:center;font-size:14px}
footer b{color:#fff}
@media(max-width:950px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:720px){.grid{grid-template-columns:repeat(2,1fr)}.hero{padding:24px 20px}}
@media(max-width:440px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <div class="header-in">
    <span class="brand">🛍️ Bazar Dzair</span>
    <a href="admin.html" style="color:#cdd2ef;font-size:13px" rel="nofollow">لوحة التحكم</a>
  </div>
</header>

<div class="hero"><div class="hero-box"><h1>كل ما تحتاجه في متجر واحد</h1><p>منتجات متنوعة، أسعار مناسبة، وتوصيل آمن لجميع الولايات — الدفع عند الاستلام (COD).</p></div></div>

<div class="search"><input id="searchInput" type="search" placeholder="🔎 ابحث عن منتج..." oninput="render()"></div>
<div class="cats" id="catBar"></div>

<main><div id="feed"><div class="loading">⏳ جاري تحميل المنتجات...</div></div></main>

<footer><div><b>© Bazar Dzair</b><br>الدفع عند الاستلام — توصيل لجميع الولايات الجزائرية</div></footer>

<script type="module">
let firebasePromise=null;
async function getFirebase(){
  if(!firebasePromise){
    firebasePromise=Promise.all([
      import("https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js"),
      import("https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js")
    ]).then(([app,store])=>({...app,...store}));
  }
  return firebasePromise;
}
const firebaseConfig={apiKey:"AIzaSyBWdA_QIy_2gOBl-bP1S1tLaGIqaZjpar8",authDomain:"bazar-dzair-33816.firebaseapp.com",projectId:"bazar-dzair-33816",storageBucket:"bazar-dzair-33816.firebasestorage.app",messagingSenderId:"51073161969",appId:"1:51073161969:web:cb75a3224bdca11ea8e750"};
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
const money=n=>Number(n||0).toLocaleString("ar-DZ")+" دج";
function productSlug(name){
  return String(name||"product").normalize("NFKD").replace(/[\u0300-\u036f]/g,"").toLowerCase().trim().replace(/[^\p{L}\p{N}]+/gu,"-").replace(/^-+|-+$/g,"");
}
const feed=document.getElementById("feed");
const catBar=document.getElementById("catBar");
let products=[];
let categories=[];
let activeCat="all";

function cardHTML(p){
  const name=p.name||p.product||"منتج";
  const img=(Array.isArray(p.images)&&p.images[0])||p.image||p.imageUrl||p.photo||"logo.svg";
  const price=Number(p.price||0);
  const href=encodeURIComponent(productSlug(name));
  return `<article class="card">
    <a class="imgbox" href="product.html?id=${href}"><img src="${esc(img)}" alt="${esc(name)}" loading="lazy" decoding="async" onerror="this.src='logo.svg'">${p.badge?`<span class="badge">${esc(p.badge)}</span>`:""}</a>
    <div class="body">
      <h3><a href="product.html?id=${href}">${esc(name)}</a></h3>
      <div class="price">${money(price)}</div>
      <a class="buy" href="product.html?id=${href}">🛒 اشترِ الآن</a>
    </div>
  </article>`;
}

function shown(){
  const q=(document.getElementById("searchInput")?.value||"").trim().toLowerCase();
  let list=products.slice();
  if(activeCat!==null&&activeCat!=="all") list=list.filter(p=>String(p.category||"")===activeCat);
  if(q) list=list.filter(p=>String(p.name||p.product||"").toLowerCase().includes(q));
  return list;
}
window.render=()=>{
  const list=shown();
  if(!list.length){feed.innerHTML='<div class="empty">لا توجد منتجات مطابقة.</div>';return;}
  feed.innerHTML=`<div class="grid">${list.map(cardHTML).join("")}</div>`;
};
function renderCats(){
  if(!catBar)return;
  const seen={};
  const items=[];
  categories.forEach(c=>{if(c.key&&c.name&&!seen[c.key]){seen[c.key]=1;items.push(c);}});
  catBar.innerHTML=`<button class="cat ${activeCat==='all'?'active':''}" onclick="setCat('all')">الكل</button>`+
    items.map(c=>`<button class="cat ${activeCat===c.key?'active':''}" onclick="setCat('${encodeURIComponent(c.key)}')">${esc(c.icon||'')} ${esc(c.name)}</button>`).join("");
}
window.setCat=k=>{activeCat=decodeURIComponent(k);renderCats();render();};

async function load(){
  try{
    const {initializeApp,getFirestore,collection,getDocs}=await getFirebase();
    const app=initializeApp(firebaseConfig);
    const db=getFirestore(app);
    const [prodSnap,catSnap]=await Promise.all([
      getDocs(collection(db,"products")),
      getDocs(collection(db,"categories"))
    ]);
    products=prodSnap.docs.map(d=>({id:d.id,...d.data()})).filter(p=>p&&(p.name||p.product));
    categories=catSnap.docs.map(d=>({key:d.id,...(d.data()||{})})).filter(c=>c.key&&c.name);
    renderCats();
    render();
  }catch(e){
    console.error(e);
    feed.innerHTML='<div class="empty">تعذر تحميل المنتجات. حاول تحديث الصفحة.</div>';
  }
}
load();
</script>
</body>
</html>
